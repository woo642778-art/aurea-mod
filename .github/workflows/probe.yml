name: Verify actual EffectCraft runtime
on:
  push:
    paths: ['.github/workflows/probe.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Prepare official runtime
        run: |
          curl --fail --location --retry 3 https://github.com/storytold/effectcraft/releases/download/v0.10.0/effectcraft-web-0.10.0.zip -o runtime.zip
          echo 'b922abeda2420391a7fd887f53ebae6948730e63720bad6a6eb3dc48dc1b46a8  runtime.zip' | sha256sum --check
          unzip -q runtime.zip -d runtime
          python3 -m pip install playwright==1.56.0
          python3 -m playwright install --with-deps chromium
      - name: Probe compiled engine, command registry and render
        run: |
          mkdir -p evidence
          python3 - <<'PY'
          import json,pathlib,subprocess,time,traceback
          from playwright.sync_api import sync_playwright
          root=pathlib.Path('runtime/effectcraft-web-0.10.0')
          server=subprocess.Popen(['python3','-m','http.server','8765','--bind','127.0.0.1','--directory',str(root)],stdout=open('evidence/http.log','w'),stderr=subprocess.STDOUT)
          time.sleep(1)
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True,args=['--no-sandbox','--enable-unsafe-swiftshader','--disable-dev-shm-usage'])
              page=browser.new_page(viewport={'width':1100,'height':800},device_scale_factor=1)
              errors=[]
              page.on('pageerror',lambda e: errors.append(str(e)))
              page.goto('http://127.0.0.1:8765/?nosw&storage=indexeddb&frameworkers=1&nogpuworkers',wait_until='domcontentloaded')
              page.wait_for_function('window.effectcraftLoad && (window.effectcraftLoad.readyMs || window.effectcraftLoad.error)',timeout=120000)
              def record(name, expression):
                  try:
                      value=page.evaluate(expression)
                  except Exception as e:
                      value={'probeError':str(e)}
                  pathlib.Path('evidence/'+name+'.json').write_text(json.dumps(value,indent=2))
                  print(name,json.dumps(value)[:7000])
                  return value
              record('load','window.effectcraftLoad')
              record('info','window.effectcraft.info()')
              record('commands','window.effectcraft.commands()')
              record('inspect','window.effectcraft.inspect()')
              record('query-project','window.effectcraft.execute("project.info",{})')
              record('effects','window.effectcraft.execute("effect.list",{})')
              record('new-comp','window.effectcraft.execute("comp.new",{name:"Mobile verification",width:320,height:240,duration:2,fps:24})')
              record('new-solid','window.effectcraft.execute("layer.newSolid",{name:"Verification",color:"#f06040",width:160,height:120})')
              record('inspect-after','window.effectcraft.inspect()')
              record('frame','window.effectcraft.renderFrame({max_side:320})')
              record('save','window.effectcraft.saveToBrowser("/Mobile-verification.ecproj")')
              record('files','window.effectcraft.files()')
              record('stored','window.effectcraft.listStored()')
              page.screenshot(path='evidence/desktop.png')
              page.set_viewport_size({'width':390,'height':844})
              page.screenshot(path='evidence/phone-upstream.png')
              pathlib.Path('evidence/errors.json').write_text(json.dumps(errors,indent=2))
              browser.close()
          server.terminate()
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: effectcraft-runtime-evidence
          path: evidence/
          retention-days: 7
