name: Verify Aurea Studio touch workspace
on:
  push:
    paths: ['.github/workflows/web.yml', 'web/**', 'tests/test_web.py', 'tests/media_roundtrip.py', 'tests/core.test.mjs', 'tests/test_http.py', 'tests/test_http.c']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate portable units and JavaScript syntax
        run: |
          set -euo pipefail
          mkdir -p evidence
          git rev-parse HEAD > evidence/source-commit.txt
          node --check web/studio.mjs
          node --test tests/core.test.mjs | tee evidence/core-tests.log
          python3 tests/test_http.py 2>&1 | tee evidence/http-tests.log
      - name: Prepare verified official offline runtime
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 https://github.com/storytold/effectcraft/releases/download/v0.10.0/effectcraft-web-0.10.0.zip -o runtime.zip
          echo 'b922abeda2420391a7fd887f53ebae6948730e63720bad6a6eb3dc48dc1b46a8  runtime.zip' | sha256sum --check
          unzip -q runtime.zip -d runtime
          cp web/* runtime/effectcraft-web-0.10.0/
          python3 -m pip install playwright==1.56.0 pillow
          python3 -m playwright install --with-deps chromium
      - name: Test actual engine through touch controls
        run: |
          set -euo pipefail
          python3 tests/test_web.py runtime/effectcraft-web-0.10.0 evidence/touch 2>&1 | tee evidence/web-tests.log
      - name: Verify media preservation and portable restore
        run: |
          set -euo pipefail
          python3 tests/media_roundtrip.py runtime/effectcraft-web-0.10.0 evidence/media 2>&1 | tee evidence/media-tests.log
      - name: Snapshot tested source
        if: always()
        run: git archive --format=zip --prefix=Aurea-Studio-source/ HEAD -o evidence/Aurea-Studio-source.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AureaCraft-web-evidence
          path: evidence/
          retention-days: 14
          if-no-files-found: error
