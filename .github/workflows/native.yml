name: Build Aurea Studio native extension
on:
  push:
    paths: ['.github/workflows/native.yml', 'native/**', 'tests/engine_test.m', 'tests/server_main.m', 'tests/test_server.py', 'tools/build_native.sh', 'tools/refine_native.py']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  native:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Apply verified startup and test lifecycle corrections
        run: python3 tools/refine_native.py
      - name: Compile for iOS and verify native contracts
        run: |
          set -o pipefail
          mkdir -p evidence
          bash tools/build_native.sh 2>&1 | tee evidence/native-build.log
      - name: Publish verified editable source correction
        run: |
          git add native/ tests/ios_smoke.m
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'test: preserve engine observer and model active host rendering'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AureaCraft-native
          path: |
            dist/AureaCraft.dylib
            dist/binary-info.txt
            dist/load-commands.txt
            dist/SHA256SUMS
            evidence/
            native/
            tests/
            tools/
          if-no-files-found: error
          retention-days: 14
