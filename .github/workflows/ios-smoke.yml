name: Verify iOS WebKit integration
on:
  push:
    paths: ['.github/workflows/ios-smoke.yml', 'native/**', 'web/**', 'tests/ios_smoke.m']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify portable and native contracts and build device extension
        run: |
          set -euo pipefail
          mkdir -p evidence
          node --test tests/core.test.mjs | tee evidence/core-tests.log
          python3 -m unittest discover -s tests -p 'test_http.py' 2>&1 | tee evidence/http-tests.log
          python3 -m unittest discover -s tests -p 'test_macho.py' 2>&1 | tee evidence/macho-tests.log
          python3 -m unittest discover -s tests -p 'test_package.py' 2>&1 | tee evidence/package-tests.log
          bash tools/build_native.sh 2>&1 | tee evidence/native-build.log
          git rev-parse HEAD > evidence/source-commit.txt
      - name: Build real simulator app and production extension
        run: |
          set -euo pipefail
          mkdir -p smoke/Smoke.app/Frameworks
          APP="$PWD/smoke/Smoke.app"
          SDK="$(xcrun --sdk iphonesimulator --show-sdk-path)"
          COMMON=(-O2 -Wall -Wextra -Wno-unused-parameter -I native -target "$(uname -m)-apple-ios16.3-simulator" -isysroot "$SDK")
          xcrun clang "${COMMON[@]}" -c native/AUHTTP.c -o smoke/http.o
          xcrun clang "${COMMON[@]}" -fobjc-arc -fmodules -dynamiclib native/AUServer.m native/AUEngineAccess.m native/AUStudio.m smoke/http.o -framework Foundation -framework UIKit -framework WebKit -framework UniformTypeIdentifiers -install_name @executable_path/Frameworks/AureaCraft.dylib -o "$APP/Frameworks/AureaCraft.dylib"
          xcrun clang "${COMMON[@]}" -fobjc-arc -fmodules tests/ios_smoke.m -framework Foundation -framework UIKit -framework WebKit -Wl,-weak_library,"$APP/Frameworks/AureaCraft.dylib" -o "$APP/Smoke"
          python3 - <<'PY'
          import pathlib,plistlib
          info={'CFBundleIdentifier':'com.aurea.studio.validation','CFBundleName':'Studio Validation','CFBundleExecutable':'Smoke','CFBundlePackageType':'APPL','CFBundleVersion':'1','CFBundleShortVersionString':'1.0','MinimumOSVersion':'16.3','UIDeviceFamily':[1,2],'UILaunchScreen':{},'UIApplicationSceneManifest':{'UIApplicationSupportsMultipleScenes':False},'NSAppTransportSecurity':{'NSAllowsLocalNetworking':True,'NSAllowsArbitraryLoadsInWebContent':True}}
          pathlib.Path('smoke/Smoke.app/Info.plist').write_bytes(plistlib.dumps(info))
          PY
          curl --fail --location --retry 3 https://github.com/storytold/effectcraft/releases/download/v0.10.0/effectcraft-web-0.10.0.zip -o smoke/runtime.zip
          echo 'b922abeda2420391a7fd887f53ebae6948730e63720bad6a6eb3dc48dc1b46a8  smoke/runtime.zip' | shasum -a 256 --check
          unzip -q smoke/runtime.zip -d smoke/runtime
          cp -R smoke/runtime/effectcraft-web-0.10.0 "$APP/AureaCraft"
          cp web/* "$APP/AureaCraft/"
          codesign --force --sign - "$APP/Frameworks/AureaCraft.dylib"
          codesign --force --sign - "$APP"
      - name: Launch and verify actual iPhone and iPad WKWebView behavior
        run: |
          set -euo pipefail
          xcrun simctl list devices available --json > evidence/devices.json
          for FAMILY in iPhone iPad; do
            mkdir -p "evidence/$FAMILY"
            DEVICE="$(python3 -c "import json;d=json.load(open('evidence/devices.json'));print(next(x['udid'] for group in d['devices'].values() for x in group if x['isAvailable'] and x['name'].startswith('$FAMILY')))")"
            echo "$DEVICE" > "evidence/$FAMILY/device-id.txt"
            xcrun simctl boot "$DEVICE" || true
            xcrun simctl bootstatus "$DEVICE" -b
            xcrun simctl install "$DEVICE" smoke/Smoke.app
            xcrun simctl launch "$DEVICE" com.aurea.studio.validation
            DATA="$(xcrun simctl get_app_container "$DEVICE" com.aurea.studio.validation data)"
            for i in $(seq 1 100); do
              if [ -f "$DATA/Documents/simulator-result.json" ]; then
                cp "$DATA/Documents/simulator-result.json" "evidence/$FAMILY/"
                break
              fi
              sleep 3
            done
            xcrun simctl io "$DEVICE" screenshot "evidence/$FAMILY/workspace.png"
            cp -R "$DATA/Documents/AureaStudio" "evidence/$FAMILY/native-storage" || true
            xcrun simctl spawn "$DEVICE" log show --last 8m --style compact --predicate 'process == "Smoke"' > "evidence/$FAMILY/simulator.log" 2>&1 || true
            python3 - "$FAMILY" <<'PY'
          import json,pathlib,sys
          p=pathlib.Path('evidence')/sys.argv[1]/'simulator-result.json'
          assert p.exists(), 'Simulator did not finish within 300 seconds'
          result=json.loads(p.read_text());print(json.dumps(result,indent=2))
          assert result['success'], result
          assert result['originalAureaTested'] is False
          PY
            xcrun simctl terminate "$DEVICE" com.aurea.studio.validation || true
            xcrun simctl shutdown "$DEVICE" || true
          done
      - name: Snapshot exact tested integration source
        if: always()
        run: git archive --format=zip --prefix=Aurea-Studio-source/ HEAD -o evidence/Aurea-Studio-source.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AureaCraft-iOS-verified-build
          path: |
            evidence/
            dist/AureaCraft.dylib
            dist/binary-info.txt
            dist/load-commands.txt
            dist/SHA256SUMS
          retention-days: 14
          if-no-files-found: error
